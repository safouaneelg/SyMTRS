# SegFormer (MiT-B0) at 512px.
#
#     symtrs train configs/segmentation/512/segformer_b0_512.yaml --data-root /data/SyMTRS
#     symtrs eval  configs/segmentation/512/segformer_b0_512.yaml --data-root /data/SyMTRS --eval-split test
#
# resolution: 512 reads train/rgb_day_lr/x4 and train/semantic_lr/x4. Input and ground
# truth are both 512, and the model is scored at 512. At this scale small objects are
# a handful of pixels, which is exactly what the rare-class metrics in eval.metrics
# are there to expose.
#
# Five classes (background, building, green, road, car): the dataset's semantic/ masks are
# graylevel PNGs holding class_id * 63 (label_step), decoded as round(value / 63); a grey
# level not near a multiple of 63 becomes the ignore index, 255. These numbers are written
# into the checkpoint, so a model trained here cannot be silently scored against a
# differently-labelled mask set later. If the mask generator ever writes 0 for "no class"
# instead of 255, change data.ignore_index in the config and not the metric - a metric
# that guesses which pixels to ignore is worse than one that does not.
#
# SegFormer (MiT-B0) is described in full at
# configs/segmentation/2048/segformer_b0_2048.yaml - read that one for why it uses
# this loss and this learning rate. What changes here is only the resolution axis.
#

task: segmentation
model: segformer_b0
resolution: 512
seed: 42

data:
  root: /data/SyMTRS
  split: train
  val_split: val
  test_split: test
  num_classes: 5
  # Masks hold class_id * 63 as 8-bit gray (background, building, green, road, car).
  label_step: 63
  # Pixels labelled 255 are excluded from both the loss and the confusion matrix.
  ignore_index: 255
  num_workers: 8
  pin_memory: true

train:
  epochs: 40
  batch_size: 32
  lr: 6.0e-5
  weight_decay: 0.01
  optim: adamw
  sched: cosine
  warmup_epochs: 2
  min_lr_ratio: 0.01
  patch_size: 0
  val_patch_size: 0
  amp: true
  gpus: 1
  grad_clip: 1.0
  grad_accum: 1
  loss: ce_dice
  freeze: ""
  log_every: 50
  save_samples_every: 1
  device: cuda

eval:
  metrics: [miou, pixel_acc, mean_acc, mean_dice, fwiou]
  batch_size: 1
  amp: true
  tile_size: 0
  tile_overlap: 128
  align: ""
  num_visualizations: 4
