# DeepLabV3 (ResNet-50) at 2048px.
#
#     symtrs train configs/segmentation/2048/deeplabv3_r50_2048.yaml --data-root /data/SyMTRS
#     symtrs eval  configs/segmentation/2048/deeplabv3_r50_2048.yaml --data-root /data/SyMTRS --eval-split test
#
# resolution: 2048 reads train/rgb_day and train/semantic - the native folders. The
# model is scored at 2048 against 2048 masks.
#
# Six classes: the dataset's semantic/ masks are graylevel PNGs, one byte per pixel, and
# 255 is the ignore index for pixels that belong to no class. Both numbers are written
# into the checkpoint, so a model trained here cannot be silently scored against a
# differently-labelled mask set later. If the mask generator ever writes 0 for "no class"
# instead of 255, change data.ignore_index in the config and not the metric - a metric
# that guesses which pixels to ignore is worse than one that does not.
#
# The cheap half of the deep segmentation family: torchvision DeepLabV3 on a
# ResNet-50 backbone pretrained on COCO+VOC, with the whole backbone trainable.
# It fits on a single mid-range GPU at these batch sizes.
#
# torchvision's DeepLabV3 emits an auxiliary head off the ResNet features and our
# loss folds its term in automatically. That is what "ce_aux" names: cross-entropy
# on both heads, weighted 0.4 to the auxiliary one (the weight from the DeepLabV3
# paper). "ce" would ignore the auxiliary head entirely.
#
# One trap worth stating: the atrous head contains BatchNorm, and torchvision's
# implementation cannot be run with a batch of 1 in training mode. train.batch_size
# must stay at 2 or more - at 256px the batch below is 32, but a `--batch-size 1` on
# the command line for a smoke run will be refused with that explanation rather than
# a shape error from inside BatchNorm.
#
# The other three cells of this row are the same file at 1024, 512 and 256, in the
# sibling folders. `symtrs sweep --task segmentation --models deeplabv3_r50` walks
# them.
#

task: segmentation
model: deeplabv3_r50
resolution: 2048
seed: 42

data:
  root: /data/SyMTRS
  split: train
  val_split: val
  test_split: test
  num_classes: 6
  # Pixels labelled 255 are excluded from both the loss and the confusion matrix.
  ignore_index: 255
  num_workers: 8
  pin_memory: true

train:
  epochs: 40
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 0.01
  optim: adamw
  sched: cosine
  warmup_epochs: 2
  min_lr_ratio: 0.01
  patch_size: 512
  val_patch_size: 0
  amp: true
  gpus: 1
  grad_clip: 1.0
  grad_accum: 1
  loss: ce_aux
  loss_kwargs:
    aux_weight: 4.0e-1
  freeze: ""
  log_every: 50
  save_samples_every: 1
  device: cuda

eval:
  metrics: [miou, pixel_acc, mean_acc, mean_dice, fwiou]
  batch_size: 1
  amp: true
  tile_size: 0
  tile_overlap: 128
  align: ""
  num_visualizations: 4
