# SegFormer (MiT-B1) at 2048px.
#
#     symtrs train configs/segmentation/2048/segformer_b1_2048.yaml --data-root /data/SyMTRS
#     symtrs eval  configs/segmentation/2048/segformer_b1_2048.yaml --data-root /data/SyMTRS --eval-split test
#
# resolution: 2048 reads train/rgb_day and train/semantic - the native folders. The
# model is scored at 2048 against 2048 masks.
#
# Five classes (background, building, green, road, car): the dataset's semantic/ masks are
# graylevel PNGs holding class_id * 63 (label_step), decoded as round(value / 63); a grey
# level not near a multiple of 63 becomes the ignore index, 255. These numbers are written
# into the checkpoint, so a model trained here cannot be silently scored against a
# differently-labelled mask set later. If the mask generator ever writes 0 for "no class"
# instead of 255, change data.ignore_index in the config and not the metric - a metric
# that guesses which pixels to ignore is worse than one that does not.
#
# The middle MiT encoder. Between this and MiT-B2 you get a clean read on how much
# of SegFormer's score is encoder scale, since the decode head is identical across
# the three.
#
# The other three cells of this row are the same file at 1024, 512 and 256, in the
# sibling folders. `symtrs sweep --task segmentation --models segformer_b1` walks
# them.
#

task: segmentation
model: segformer_b1
resolution: 2048
seed: 42

data:
  root: /data/SyMTRS
  split: train
  val_split: val
  test_split: test
  num_classes: 5
  # Masks hold class_id * 63 as 8-bit gray (background, building, green, road, car).
  label_step: 63
  # Pixels labelled 255 are excluded from both the loss and the confusion matrix.
  ignore_index: 255
  num_workers: 8
  pin_memory: true

train:
  epochs: 40
  batch_size: 4
  lr: 6.0e-5
  weight_decay: 0.01
  optim: adamw
  sched: cosine
  warmup_epochs: 2
  min_lr_ratio: 0.01
  patch_size: 512
  val_patch_size: 0
  amp: true
  gpus: 1
  grad_clip: 1.0
  grad_accum: 2
  loss: ce_dice
  freeze: ""
  log_every: 50
  save_samples_every: 1
  device: cuda

eval:
  metrics: [miou, pixel_acc, mean_acc, mean_dice, fwiou]
  batch_size: 1
  amp: true
  tile_size: 0
  tile_overlap: 128
  align: ""
  num_visualizations: 4
