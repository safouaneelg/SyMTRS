# SegFormer (MiT-B1) at 1024px.
#
#     symtrs train configs/segmentation/1024/segformer_b1_1024.yaml --data-root /data/SyMTRS
#     symtrs eval  configs/segmentation/1024/segformer_b1_1024.yaml --data-root /data/SyMTRS --eval-split test
#
# resolution: 1024 reads train/rgb_day_lr/x2 and train/semantic_lr/x2. Input and
# ground truth are both 1024, and the model is scored at 1024 - this is the same
# segmentation task on smaller imagery, not super-resolution. Compare it to the 2048
# run to see what the lost detail costs, which is the question the resolution axis
# exists to answer.
#
# Five classes (background, building, green, road, car): the dataset's semantic/ masks are
# graylevel PNGs holding class_id * 63 (label_step), decoded as round(value / 63); a grey
# level not near a multiple of 63 becomes the ignore index, 255. These numbers are written
# into the checkpoint, so a model trained here cannot be silently scored against a
# differently-labelled mask set later. If the mask generator ever writes 0 for "no class"
# instead of 255, change data.ignore_index in the config and not the metric - a metric
# that guesses which pixels to ignore is worse than one that does not.
#
# Class 0 (background) has no pixel in any split of the current capture, so its IoU is
# null and mIoU averages the classes that exist; the result's `miou_classes` says how
# many. A class absent from the ground truth but predicted still counts, as IoU 0.
#
# SegFormer (MiT-B1) is described in full at
# configs/segmentation/2048/segformer_b1_2048.yaml - read that one for why it uses
# this loss and this learning rate. What changes here is only the resolution axis.
#

task: segmentation
model: segformer_b1
resolution: 1024
seed: 42

data:
  root: /data/SyMTRS
  split: train
  val_split: val
  test_split: test
  num_classes: 5
  # Masks hold class_id * 63 as 8-bit gray (background, building, green, road, car).
  label_step: 63
  # Pixels labelled 255 are excluded from both the loss and the confusion matrix.
  ignore_index: 255
  num_workers: 8
  pin_memory: true

train:
  epochs: 40
  batch_size: 8
  lr: 6.0e-5
  weight_decay: 0.01
  optim: adamw
  sched: cosine
  warmup_epochs: 2
  min_lr_ratio: 0.01
  patch_size: 512
  # 0 = the whole image at val and test, whatever patch_size is (see eval.tile_size).
  val_patch_size: 0
  amp: true
  gpus: 1
  grad_clip: 1.0
  grad_accum: 2
  loss: ce_dice
  freeze: ""
  log_every: 50
  save_samples_every: 1
  device: cuda

eval:
  metrics: [miou, pixel_acc, mean_acc, mean_dice, fwiou]
  batch_size: 1
  amp: true
  # The whole 1024px image is scored (val and test alike), in 512px windows
  # with 128px overlap: the size this row trained on, so the network sees the same
  # field of view at evaluation. Never a crop - every pixel is covered and the result is
  # deterministic.
  tile_size: 512
  tile_overlap: 128
  align: ""
  num_visualizations: 4
