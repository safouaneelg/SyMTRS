# DeepLabV3 (ResNet-50) at 1024px.
#
#     symtrs train configs/segmentation/1024/deeplabv3_r50_1024.yaml --data-root /data/SyMTRS
#     symtrs eval  configs/segmentation/1024/deeplabv3_r50_1024.yaml --data-root /data/SyMTRS --eval-split test
#
# resolution: 1024 reads train/rgb_day_lr/x2 and train/semantic_lr/x2. Input and
# ground truth are both 1024, and the model is scored at 1024 - this is the same
# segmentation task on smaller imagery, not super-resolution. Compare it to the 2048
# run to see what the lost detail costs, which is the question the resolution axis
# exists to answer.
#
# Six classes: the dataset's semantic/ masks are graylevel PNGs, one byte per pixel, and
# 255 is the ignore index for pixels that belong to no class. Both numbers are written
# into the checkpoint, so a model trained here cannot be silently scored against a
# differently-labelled mask set later. If the mask generator ever writes 0 for "no class"
# instead of 255, change data.ignore_index in the config and not the metric - a metric
# that guesses which pixels to ignore is worse than one that does not.
#
# DeepLabV3 (ResNet-50) is described in full at
# configs/segmentation/2048/deeplabv3_r50_2048.yaml - read that one for why it uses
# this loss and this learning rate. What changes here is only the resolution axis.
#

task: segmentation
model: deeplabv3_r50
resolution: 1024
seed: 42

data:
  root: /data/SyMTRS
  split: train
  val_split: val
  test_split: test
  num_classes: 6
  # Pixels labelled 255 are excluded from both the loss and the confusion matrix.
  ignore_index: 255
  num_workers: 8
  pin_memory: true

train:
  epochs: 40
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 0.01
  optim: adamw
  sched: cosine
  warmup_epochs: 2
  min_lr_ratio: 0.01
  patch_size: 512
  val_patch_size: 0
  amp: true
  gpus: 1
  grad_clip: 1.0
  grad_accum: 1
  loss: ce_aux
  loss_kwargs:
    aux_weight: 4.0e-1
  freeze: ""
  log_every: 50
  save_samples_every: 1
  device: cuda

eval:
  metrics: [miou, pixel_acc, mean_acc, mean_dice, fwiou]
  batch_size: 1
  amp: true
  tile_size: 0
  tile_overlap: 128
  align: ""
  num_visualizations: 4
