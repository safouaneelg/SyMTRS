# Small from-scratch U-Net at 256px.
#
#     symtrs train configs/segmentation/256/unet_small_256.yaml --data-root /data/SyMTRS
#     symtrs eval  configs/segmentation/256/unet_small_256.yaml --data-root /data/SyMTRS --eval-split test
#
# resolution: 256 reads train/rgb_day_lr/x8 and train/semantic_lr/x8. Input and ground
# truth are both 256. This is the floor of the grid: a class that survives here is a
# class the model genuinely recognises rather than one it resolves.
#
# Five classes (background, building, green, road, car): the dataset's semantic/ masks are
# graylevel PNGs holding class_id * 63 (label_step), decoded as round(value / 63); a grey
# level not near a multiple of 63 becomes the ignore index, 255. These numbers are written
# into the checkpoint, so a model trained here cannot be silently scored against a
# differently-labelled mask set later. If the mask generator ever writes 0 for "no class"
# instead of 255, change data.ignore_index in the config and not the metric - a metric
# that guesses which pixels to ignore is worse than one that does not.
#
# Class 0 (background) has no pixel in any split of the current capture, so mIoU averages
# the classes that have ground truth in the evaluated split (the same set for every model);
# `miou_classes` says how many. A class absent from the ground truth but predicted keeps
# IoU 0 and its false positives are in `fp_pixels_k`, but it is not averaged.
#
# Small from-scratch U-Net is described in full at
# configs/segmentation/2048/unet_small_2048.yaml - read that one for why it uses
# this loss and this learning rate. What changes here is only the resolution axis.
#

task: segmentation
model: unet_small
resolution: 256
seed: 42

data:
  root: /data/SyMTRS
  split: train
  val_split: val
  test_split: test
  num_classes: 5
  # Masks hold class_id * 63 as 8-bit gray (background, building, green, road, car).
  label_step: 63
  # Pixels labelled 255 are excluded from both the loss and the confusion matrix.
  ignore_index: 255
  num_workers: 8
  pin_memory: true

train:
  epochs: 40
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 0.01
  optim: adamw
  sched: cosine
  warmup_epochs: 2
  min_lr_ratio: 0.01
  patch_size: 0
  # 0 = the whole image at val and test, whatever patch_size is (see eval.tile_size).
  val_patch_size: 0
  amp: true
  gpus: 1
  grad_clip: 1.0
  grad_accum: 1
  loss: ce_dice
  freeze: ""
  log_every: 50
  save_samples_every: 1
  device: cuda

eval:
  metrics: [miou, pixel_acc, mean_acc, mean_dice, fwiou]
  batch_size: 1
  amp: true
  # Whole image in one forward pass: training did not crop at this resolution either.
  tile_size: 0
  tile_overlap: 128
  align: ""
  num_visualizations: 4
