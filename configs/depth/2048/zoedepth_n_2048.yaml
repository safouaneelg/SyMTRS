# ZoeDepth-N at 2048px (x1 of native).
#
#     symtrs train configs/depth/2048/zoedepth_n_2048.yaml --data-root /data/SyMTRS
#     symtrs eval  configs/depth/2048/zoedepth_n_2048.yaml --data-root /data/SyMTRS --eval-split test
#
# resolution: 2048 reads train/rgb_day and train/depth - the native folders. Nothing
# is downsampled and nothing is upsampled: this is the data as it was generated.
#
# ZoeDepth-N (ZoeD_M12_N) is a metric model - fine-tuned on NYU-Depth-v2, indoor,
# 0-10 m - that this benchmark scores as relative depth: its indoor metres do not
# transfer to a camera 70-270 m up, so it gets align: scale and the SILog loss.
# Swapping this config's model to zoedepth_k changes both of those, which is the
# whole reason the depth adapters carry a `protocol` attribute. Its output is DEPTH
# (not disparity), so the alignment is a scale in depth space.
#
# Float16 is not safe for this head: under fp16 autocast ~10% of the output pixels
# were NaN on the RTX 5070 Ti (training loss non-finite from step 1, every evaluated
# prediction non-positive); fp32 and bfloat16 agree to 3 digits and are finite. The
# adapter therefore runs this model in bfloat16 (fp32 on a GPU without it) inside
# any CUDA autocast, so amp: true stays as it is in every other file.
#
# ZoeDepth resizes its input to a 384px minimum side internally, so a 2048px crop
# costs memory it does not spend on detail; 512 is the crop that reaches the network
# at the scale it was trained for. The encoder is frozen because that resize is the
# part that already works.
#
# The other three cells of this row are the same file at 1024, 512 and 256, in the
# sibling folders. `symtrs sweep --task depth --models zoedepth_n` walks them.
#

task: depth
model: zoedepth_n
resolution: 2048
seed: 42

data:
  root: /data/SyMTRS
  split: train
  val_split: val
  test_split: test
  # Metres are what the metric models predict. The real EXRs store CENTIMETRES (hence
  # 0.01); `symtrs doctor --data-root` prints the median in metres to check it.
  depth_scale: 0.01
  # Metres, after depth_scale: the sky is a huge value, not zero, so it is cut here.
  max_depth: 1000
  depth_channel: 0
  depth_backend: auto
  num_workers: 8
  pin_memory: true

train:
  epochs: 20
  batch_size: 2
  lr: 5.0e-6
  weight_decay: 0.01
  optim: adamw
  sched: cosine
  warmup_epochs: 1
  min_lr_ratio: 0.01
  # Random 512px crops: a full 2048px batch is more memory than this
  # encoder can hold, and the crop still shows a representative slice of the scene
  # at this ground sampling distance.
  patch_size: 512
  # 0 = the whole image at val and test, whatever patch_size is (see eval.tile_size).
  val_patch_size: 0
  amp: true
  gpus: 1
  grad_clip: 1.0
  grad_accum: 4
  # Effective batch = 2 x 4 = 8,
  # which is what the learning rate was chosen against.
  loss: silog
  freeze: encoder
  log_every: 50
  save_samples_every: 1
  device: cuda

eval:
  # The first name here that the depth scorer can minimise decides which checkpoint
  # weights/best.pt holds. The rest are reported but do not select it.
  metrics: [rmse, mae, abs_rel, sq_rel, d1, d2, d3, silog]
  batch_size: 1
  amp: true
  # The whole 2048px image is scored (val and test alike), in 512px windows
  # with 128px overlap: the size this row trained on, so the network sees the same
  # field of view at evaluation. Never a crop - every pixel is covered and the result is
  # deterministic.
  # Relative depth is defined per forward pass only up to scale and shift, so each
  # window is first fitted onto the ones already stitched; the alignment that scores
  # the row is then computed once, on the full stitched image (engine/tiling.py).
  tile_size: 512
  tile_overlap: 128
  align: scale
  num_visualizations: 4
