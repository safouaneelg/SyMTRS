# MiDaS DPT-Hybrid at 2048px (x1 of native).
#
#     symtrs train configs/depth/2048/midas_dpt_hybrid_2048.yaml --data-root /data/SyMTRS
#     symtrs eval  configs/depth/2048/midas_dpt_hybrid_2048.yaml --data-root /data/SyMTRS --eval-split test
#
# resolution: 2048 reads train/rgb_day and train/depth - the native folders. Nothing
# is downsampled and nothing is upsampled: this is the data as it was generated.
#
# The standard published baseline, and the model the MiDaS numbers in the paper's
# comparison table are quoted from. Relative-depth: it predicts disparity, and a
# per-image affine fit in disparity space (scale AND shift, then inverted) is needed
# before any metric means anything, which is what eval.align does. Training uses the
# scale-and-shift-invariant `ssi` loss, the family MiDaS itself was trained with, so
# the fine-tune starts from a matched objective instead of fighting a metric loss
# the pretrained head has never seen.
#
# At 2048 a full batch of 4 is ~200MB of input per step and the DPT decoder's
# attention is quadratic in the token count on top of that, so training crops to
# 384px patches. Below 2048 the whole image fits and patch_size drops to 0.
#
# The other three cells of this row are the same file at 1024, 512 and 256, in the
# sibling folders. `symtrs sweep --task depth --models midas_dpt_hybrid` walks them.
#

task: depth
model: midas_dpt_hybrid
resolution: 2048
seed: 42

data:
  root: /data/SyMTRS
  split: train
  val_split: val
  test_split: test
  # Metres are what the metric models predict. The real EXRs store CENTIMETRES (hence
  # 0.01); `symtrs doctor --data-root` prints the median in metres to check it.
  depth_scale: 0.01
  # Metres, after depth_scale: the sky is a huge value, not zero, so it is cut here.
  max_depth: 1000
  depth_channel: 0
  depth_backend: auto
  num_workers: 8
  pin_memory: true

train:
  epochs: 20
  batch_size: 4
  lr: 1.0e-5
  weight_decay: 0.01
  optim: adamw
  sched: cosine
  warmup_epochs: 1
  min_lr_ratio: 0.01
  # Random 384px crops: a full 2048px batch is more memory than this
  # encoder can hold, and the crop still shows a representative slice of the scene
  # at this ground sampling distance.
  patch_size: 384
  # 0 = the whole image at val and test, whatever patch_size is (see eval.tile_size).
  val_patch_size: 0
  amp: true
  gpus: 1
  grad_clip: 1.0
  grad_accum: 1
  loss: ssi
  freeze: ""
  log_every: 50
  save_samples_every: 1
  device: cuda

eval:
  # The first name here that the depth scorer can minimise decides which checkpoint
  # weights/best.pt holds. The rest are reported but do not select it.
  metrics: [rmse, mae, abs_rel, sq_rel, d1, d2, d3, silog]
  batch_size: 1
  amp: true
  # The whole 2048px image is scored (val and test alike), in 384px windows
  # with 96px overlap: the size this row trained on, so the network sees the same
  # field of view at evaluation. Never a crop - every pixel is covered and the result is
  # deterministic.
  # Relative depth is defined per forward pass only up to scale and shift, so each
  # window is first fitted onto the ones already stitched; the alignment that scores
  # the row is then computed once, on the full stitched image (engine/tiling.py).
  tile_size: 384
  tile_overlap: 96
  align: scale_shift_disparity
  num_visualizations: 4
