# Depth Anything 3 Large (metric) at 2048px (x1 of native).
#
#     symtrs train configs/depth/2048/da3_metric_large_2048.yaml --data-root /data/SyMTRS
#     symtrs eval  configs/depth/2048/da3_metric_large_2048.yaml --data-root /data/SyMTRS --eval-split test
#
# resolution: 2048 reads train/rgb_day and train/depth - the native folders. Nothing
# is downsampled and nothing is upsampled: this is the data as it was generated.
#
# The metric head: metres, no alignment, BErHu. Same loader caveats as da3_large.
# One extra: the DA3 Hugging Face repos do not all ship an image-processor config,
# so `AutoImageProcessor.from_pretrained` can refuse. That raises with the model id
# and the command to run - `symtrs doctor --model da3_metric_large --build` - rather
# than silently substituting some other normalisation.
#
# Metres need the camera: the metric head returns canonical depth (a 300 px camera)
# and metres = canonical * focal_px / 300. Without focal_px it scored abs_rel 0.91-0.96
# and d1 = 0 on the real data (predictions ~4% of the ground truth). The focal length
# is derived, never typed: build_from_config sets model_kwargs.focal_px =
# (resolution / 2) / tan(data.camera_hfov_deg / 2) - 1773.6 px at 2048, half that at
# 1024, and so on - so it follows the resolution axis, and a crop or a tile keeps it
# because it keeps the pixel size. data.camera_hfov_deg is 60 degrees, confirmed by
# the dataset owner (2026-10-17: the SyMTRS capture camera is always 60). The dataset
# does not store it and the actor property is editable per instance, so a capture
# with another FOV must set data.camera_hfov_deg.
#
# The other three cells of this row are the same file at 1024, 512 and 256, in the
# sibling folders. `symtrs sweep --task depth --models da3_metric_large` walks them.
#

task: depth
model: da3_metric_large
resolution: 2048
seed: 42

data:
  root: /data/SyMTRS
  split: train
  val_split: val
  test_split: test
  # Metres are what the metric models predict. The real EXRs store CENTIMETRES (hence
  # 0.01); `symtrs doctor --data-root` prints the median in metres to check it.
  depth_scale: 0.01
  # Metres, after depth_scale: the sky is a huge value, not zero, so it is cut here.
  max_depth: 1000
  # Horizontal field of view of the capture camera. ASSUMPTION: 60 degrees is the capture
  # actor's default (FieldOfView = 60.f) and is editable per level - confirm it. It fixes
  # the focal length in pixels the metric model needs: (resolution / 2) / tan(fov / 2).
  camera_hfov_deg: 60.0
  depth_channel: 0
  depth_backend: auto
  num_workers: 8
  pin_memory: true

train:
  epochs: 20
  batch_size: 4
  lr: 1.0e-5
  weight_decay: 0.01
  optim: adamw
  sched: cosine
  warmup_epochs: 1
  min_lr_ratio: 0.01
  # Random 512px crops: a full 2048px batch is more memory than this
  # encoder can hold, and the crop still shows a representative slice of the scene
  # at this ground sampling distance.
  patch_size: 512
  # 0 = the whole image at val and test, whatever patch_size is (see eval.tile_size).
  val_patch_size: 0
  amp: true
  gpus: 1
  grad_clip: 1.0
  grad_accum: 2
  # Effective batch = 4 x 2 = 8,
  # which is what the learning rate was chosen against.
  loss: berhu
  freeze: ""
  log_every: 50
  save_samples_every: 1
  device: cuda

eval:
  # The first name here that the depth scorer can minimise decides which checkpoint
  # weights/best.pt holds. The rest are reported but do not select it.
  metrics: [rmse, mae, abs_rel, sq_rel, d1, d2, d3, silog]
  batch_size: 1
  amp: true
  # The whole 2048px image is scored (val and test alike), in 512px windows
  # with 128px overlap: the size this row trained on, so the network sees the same
  # field of view at evaluation. Never a crop - every pixel is covered and the result is
  # deterministic.
  tile_size: 512
  tile_overlap: 128
  align: none
  num_visualizations: 4
