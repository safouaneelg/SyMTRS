# Apple Depth Pro at 2048px (x1 of native).
#
#     symtrs train configs/depth/2048/depth_pro_2048.yaml --data-root /data/SyMTRS
#     symtrs eval  configs/depth/2048/depth_pro_2048.yaml --data-root /data/SyMTRS --eval-split test
#
# resolution: 2048 reads train/rgb_day and train/depth - the native folders. Nothing
# is downsampled and nothing is upsampled: this is the data as it was generated.
#
# Metric depth from Apple: ~1.9GB of weights, a ViT-L encoder that wants a 1536px
# input, and the heaviest forward pass in the pack. The encoder is frozen for that
# reason - 300M+ parameters, and the head is what adapts to a new sensor.
#
# Memory, measured (RTX 5070 Ti Laptop, 12GB, amp on, one training step): ~7.9GiB
# at batch 1 with the encoder frozen (3.6GiB of weights, the rest decoder
# activations), against an out-of-memory above 11GiB without it. That is why this
# model is batch 1 and uncropped at every resolution: `infer` resizes any input to
# 1536x1536 before the 35 overlapping 384px ViT-L passes, and that size is fixed by
# the architecture (forward() asserts it), so neither a crop nor a smaller
# resolution makes the step cheaper. Scoring the native 2048 frame in one pass
# peaks at ~5.7GiB. Without `train.freeze: encoder` it does not fit on 12GB.
#
# The one thing about this model that is not plug-and-play for aerial imagery is the
# focal length, and it is worth getting right before a long run:
#
#   * With `f_px: null` (the default below) Depth Pro estimates the field of view
#     with its own head. That head was trained on internet photography, so a nadir
#     aerial frame can be given a plausible-looking but wrong FOV - and because the
#     model predicts metres, a wrong FOV is a wrong *scale* over the whole scene.
#     Depth ordering looks perfect and RMSE is bad.
#   * Set `f_px` to the SyMTRS camera's true focal length in pixels and the metric
#     prediction is anchored. That is the honest way to run this baseline.
#
# Depth Pro windows its own inference internally at 1536px, so scoring at 2048 in
# one pass does not mean the model saw 2048 pixels at once.
#
# The other three cells of this row are the same file at 1024, 512 and 256, in the
# sibling folders. `symtrs sweep --task depth --models depth_pro` walks them.
#

task: depth
model: depth_pro
resolution: 2048
seed: 42

model_kwargs:
  f_px: null

data:
  root: /data/SyMTRS
  split: train
  val_split: val
  test_split: test
  # Metres are what the metric models predict. The real EXRs store CENTIMETRES (hence
  # 0.01); `symtrs doctor --data-root` prints the median in metres to check it.
  depth_scale: 0.01
  # Metres, after depth_scale: the sky is a huge value, not zero, so it is cut here.
  max_depth: 1000
  depth_channel: 0
  depth_backend: auto
  num_workers: 8
  pin_memory: true

train:
  epochs: 20
  batch_size: 1
  lr: 5.0e-6
  weight_decay: 0.01
  optim: adamw
  sched: cosine
  warmup_epochs: 1
  min_lr_ratio: 0.01
  # No crop: this network resizes its input to a fixed size, so a crop would cost
  # the same and show it less. The memory posture is in the header above.
  patch_size: 0
  # 0 = the whole image at val and test, whatever patch_size is (see eval.tile_size).
  val_patch_size: 0
  amp: true
  gpus: 1
  grad_clip: 1.0
  grad_accum: 8
  # Effective batch = 1 x 8 = 8,
  # which is what the learning rate was chosen against.
  loss: berhu
  freeze: encoder
  log_every: 50
  save_samples_every: 1
  device: cuda

eval:
  # The first name here that the depth scorer can minimise decides which checkpoint
  # weights/best.pt holds. The rest are reported but do not select it.
  metrics: [rmse, mae, abs_rel, sq_rel, d1, d2, d3, silog]
  batch_size: 1
  amp: true
  # Whole image in one forward pass: training did not crop at this resolution either.
  tile_size: 0
  tile_overlap: 128
  align: none
  num_visualizations: 4
