# Depth Anything 3 Large (metric) at 1024px (x2 of native).
#
#     symtrs train configs/depth/1024/da3_metric_large_1024.yaml --data-root /data/SyMTRS
#     symtrs eval  configs/depth/1024/da3_metric_large_1024.yaml --data-root /data/SyMTRS --eval-split test
#
# resolution: 1024 reads train/rgb_day_lr/x2 and train/depth_lr/x2. Input and ground
# truth are both 1024, so this is the same task on smaller imagery, not a model being
# asked to upsample. The 2048 and 1024 runs are two rows of one table, not two stages
# of a pipeline.
#
# Depth Anything 3 Large (metric) is described in full at configs/depth/2048/da3_metric_large_2048.yaml -
# read that one for the protocol and the memory posture. What changes here is only
# the numbers on the resolution axis.
#
# This model is metric-depth at every resolution, so the loss stays
# berhu and eval.align stays none. A row that switches protocol
# between resolutions is not comparable to itself.
#

task: depth
model: da3_metric_large
resolution: 1024
seed: 42

data:
  root: /data/SyMTRS
  split: train
  val_split: val
  test_split: test
  # Metres are what the metric models predict. The real EXRs store CENTIMETRES (hence
  # 0.01); `symtrs doctor --data-root` prints the median in metres to check it.
  depth_scale: 0.01
  # Metres, after depth_scale: the sky is a huge value, not zero, so it is cut here.
  max_depth: 1000
  # Horizontal field of view of the capture camera. ASSUMPTION: 60 degrees is the capture
  # actor's default (FieldOfView = 60.f) and is editable per level - confirm it. It fixes
  # the focal length in pixels the metric model needs: (resolution / 2) / tan(fov / 2).
  camera_hfov_deg: 60.0
  depth_channel: 0
  depth_backend: auto
  num_workers: 8
  pin_memory: true

train:
  epochs: 20
  batch_size: 8
  lr: 1.0e-5
  weight_decay: 0.01
  optim: adamw
  sched: cosine
  warmup_epochs: 1
  min_lr_ratio: 0.01
  # Random 512px crops: a full 1024px batch is more memory than this
  # encoder can hold, and the crop still shows a representative slice of the scene
  # at this ground sampling distance.
  patch_size: 512
  # 0 = the whole image at val and test, whatever patch_size is (see eval.tile_size).
  val_patch_size: 0
  amp: true
  gpus: 1
  grad_clip: 1.0
  grad_accum: 2
  # Effective batch = 8 x 2 = 16,
  # which is what the learning rate was chosen against.
  loss: berhu
  freeze: ""
  log_every: 50
  save_samples_every: 1
  device: cuda

eval:
  # The first name here that the depth scorer can minimise decides which checkpoint
  # weights/best.pt holds. The rest are reported but do not select it.
  metrics: [rmse, mae, abs_rel, sq_rel, d1, d2, d3, silog]
  batch_size: 1
  amp: true
  # The whole 1024px image is scored (val and test alike), in 512px windows
  # with 128px overlap: the size this row trained on, so the network sees the same
  # field of view at evaluation. Never a crop - every pixel is covered and the result is
  # deterministic.
  tile_size: 512
  tile_overlap: 128
  align: none
  num_visualizations: 4
