# MiDaS DPT-SwinV2-Tiny at 1024px (x2 of native).
#
#     symtrs train configs/depth/1024/midas_dpt_swin2_tiny_1024.yaml --data-root /data/SyMTRS
#     symtrs eval  configs/depth/1024/midas_dpt_swin2_tiny_1024.yaml --data-root /data/SyMTRS --eval-split test
#
# resolution: 1024 reads train/rgb_day_lr/x2 and train/depth_lr/x2. Input and ground
# truth are both 1024, so this is the same task on smaller imagery, not a model being
# asked to upsample. The 2048 and 1024 runs are two rows of one table, not two stages
# of a pipeline.
#
# MiDaS DPT-SwinV2-Tiny is described in full at configs/depth/2048/midas_dpt_swin2_tiny_2048.yaml -
# read that one for the protocol and the memory posture. What changes here is only
# the numbers on the resolution axis.
#
# This model is relative-depth at every resolution, so the loss stays
# ssi and eval.align stays scale_shift_disparity. A row that switches protocol
# between resolutions is not comparable to itself.
#

task: depth
model: midas_dpt_swin2_tiny
resolution: 1024
seed: 42

data:
  root: /data/SyMTRS
  split: train
  val_split: val
  test_split: test
  # Metres are what the metric models predict. The real EXRs store CENTIMETRES (hence
  # 0.01); `symtrs doctor --data-root` prints the median in metres to check it.
  depth_scale: 0.01
  # Metres, after depth_scale: the sky is a huge value, not zero, so it is cut here.
  max_depth: 1000
  depth_channel: 0
  depth_backend: auto
  num_workers: 8
  pin_memory: true

train:
  epochs: 20
  batch_size: 8
  lr: 2.0e-5
  weight_decay: 0.01
  optim: adamw
  sched: cosine
  warmup_epochs: 1
  min_lr_ratio: 0.01
  # The whole image fits at this resolution, so no cropping is needed.
  patch_size: 0
  # 0 = the whole image at val and test, whatever patch_size is (see eval.tile_size).
  val_patch_size: 0
  amp: true
  gpus: 1
  grad_clip: 1.0
  grad_accum: 1
  loss: ssi
  freeze: ""
  log_every: 50
  save_samples_every: 1
  device: cuda

eval:
  # The first name here that the depth scorer can minimise decides which checkpoint
  # weights/best.pt holds. The rest are reported but do not select it.
  metrics: [rmse, mae, abs_rel, sq_rel, d1, d2, d3, silog]
  batch_size: 1
  amp: true
  # Whole image in one forward pass: training did not crop at this resolution either.
  tile_size: 0
  tile_overlap: 128
  align: scale_shift_disparity
  num_visualizations: 4
