# SRCNN at x1 (input 2048px -> target 2048px).
#
#     symtrs train configs/superresolution/srcnn_x1.yaml --data-root /data/SyMTRS
#     symtrs eval  configs/superresolution/srcnn_x1.yaml --data-root /data/SyMTRS --eval-split test
#
# resolution: 2048 means scale x1: the LR input and the HR target are the *same* folder
# (rgb_day), and the model is an image-to-image refiner rather than an upsampler. It is
# a legitimate control row - it isolates how much of a x4 result is restoration rather
# than resolution, which is the question worth asking when the low-resolution folders
# were produced by downsampling the same captures - but it is not super-resolution, and
# the run's own summary says so. Nothing is upsampled here.
#
# Three convolutional layers on a bicubic-upsampled input: the cheapest baseline
# there is, and deliberately so - it establishes what a purely local, shallow mapping
# recovers before any of the deep models get credit for it.
#
# `use_y_channel: true` is SRCNN's own convention: the network sees the luma channel
# only. The trainer then scores PSNR / SSIM / MSE on the luma channel too - it does not
# put the bicubic chroma back, so a Y-channel row is not comparable with an RGB row.
# That matches how the published SRCNN numbers are produced, and it also makes this
# run about a third the cost of the colour version.
#
# The real super-resolution cells of this row are srcnn_x2.yaml,
# srcnn_x4.yaml and srcnn_x8.yaml in this folder.
#
# Training is on random aligned crops: 256px of the LR input and the
# matching 256px of the target. A whole 2048px frame does not fit a 12 GB card for any
# model here. Validation and test score the WHOLE image (val_patch_size: 0), pushed
# through the network in eval.tile_size windows where it does not fit in one pass;
# PSNR / SSIM / MSE are computed per image on the stitched result and averaged.
#
# The training code for this task predates the `symtrs` package and now lives inside
# it: `symtrs/legacy/superres/train.py` owns the model set, the data loading and the
# metrics, launched as `python -m symtrs.legacy.superres.train`. `symtrs` translates
# this config into that command line and reads test_metrics.json back.
# `symtrs train <this file> --dry-run` prints it without launching anything, which is
# the quickest way to see which two folders a scale will read.
#

task: superresolution
model: srcnn
resolution: 2048
seed: 42

model_kwargs:
  use_y_channel: true
  # Set use_y_channel false to train on RGB instead of luma; the
  # published SRCNN numbers are Y-channel, so changing it also changes
  # what you are comparing against.

data:
  root: /data/SyMTRS
  split: train
  val_split: val
  test_split: test
  num_workers: 8
  pin_memory: true

train:
  epochs: 40
  batch_size: 16
  lr: 1.0e-4
  save_samples_every: 1
  gpus: 1
  device: cuda
  # A path here resumes a previous run; `symtrs eval` scores the run directory's
  # weights/best.pt without training at all.
  resume: ""
  # LR pixels of the random training crop, every model: a fixed 256px target region, so the target
  # crop is x1 that = 256px.
  patch_size: 256
  # 0 = the whole image at val and test, never the training crop.
  val_patch_size: 0

eval:
  # The super-resolution scorer always reports PSNR, SSIM and MSE; `metrics` is the
  # reported order, and the first name here is what `symtrs tables` prints first.
  metrics: [psnr, ssim, mse]
  batch_size: 1
  amp: true
  num_visualizations: 4
  # The whole image is scored in windows of this many LR pixels, blended and stitched;
  # metrics are computed on the stitched image. Larger than the training crop on purpose
  # (see SR_EVAL_TILE in configs/generate_grid.py); a frame no larger than the window is
  # scored in one pass.
  tile_size: 512
  tile_overlap: 64
